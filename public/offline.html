<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Você está offline • Respira</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      margin: 0;
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background-color: #F7F9F7;
      color: #173D3B;
      text-align: center;
      box-sizing: border-box;
    }
    .card {
      background: #FFFFFF;
      border: 1px solid #DCE5E2;
      border-radius: 20px;
      padding: 32px 24px;
      max-width: 400px;
      box-shadow: 0 4px 12px rgba(23, 61, 59, 0.06);
    }
    .icon {
      font-size: 48px;
      margin-bottom: 12px;
    }
    h1 {
      font-size: 20px;
      margin: 0 0 8px 0;
      color: #173D3B;
    }
    p {
      font-size: 14px;
      line-height: 1.5;
      color: #667775;
      margin: 0 0 20px 0;
    }
    button {
      background-color: #2F7F7C;
      color: #FFFFFF;
      border: none;
      padding: 12px 20px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">🌿</div>
    <h1>Sem conexão no momento</h1>
    <p>O Respira continua funcionando localmente. Suas práticas de respiração salvas continuam disponíveis.</p>
    <button onclick="window.location.reload()">Tentar novamente</button>
  </div>
</body>
</html>
