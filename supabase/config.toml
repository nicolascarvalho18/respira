# =====================================================================
# RESPIRA DIGITAL HEALTH PLATFORM - SUPABASE CLI CONFIGURATION
# Standard configuration for local Supabase emulator & migrations
# =====================================================================

project_id = "respira-health"

[api]
enabled = true
port = 54321
schemas = ["public", "storage"]
extra_search_path = ["public", "extensions"]
max_rows = 100

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[auth]
enabled = true
port = 54324
site_url = "http://localhost:8081"
additional_redirect_urls = ["https://respira-one.vercel.app", "http://localhost:8082"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true

[storage]
enabled = true
port = 54323
file_size_limit = "5MiB"
